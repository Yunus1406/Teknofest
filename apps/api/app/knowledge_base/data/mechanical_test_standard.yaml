# Mekanik Test Standartları Kütüphanesi (Faz F.6, Sistem Referans). `unit`
# alanları app/services/test_targets.py'nin _MECHANICAL_TEST_UNITS
# sözlüğüyle AYNI olmalıdır (tensile=MPa, elongation=%, dart_impact=J,
# tear=N, seal=N/15mm) -- aksi halde önerilen aralık yanlış birimde görünür.
#
# ÖNEMLİ — DEMO/VARSAYIMSAL VERİ UYARISI: aşağıdaki aralıklar genel esnek
# ambalaj filmi literatüründen TEMSİLİ değerlerdir, madde/kalınlığa göre
# gerçekte büyük ölçüde değişir -- kaynaklı bir veritabanı entegrasyonu YOK.
# Bu kütüphane SADECE bir ÖNERİ sağlar; Faz D.2'nin gerçek Geçti/Kaldı kararı
# HER ZAMAN kullanıcının kendi girdiği target_min/target_max'a bakar.
- test_type: tensile
  standard_name: "ASTM D882"
  unit: MPa
  packaging_category: null
  typical_min: 15
  typical_max: 40
  source: "Genel esnek film literatürü (temsili) — kaynak doğrulaması yapılmadı"
  year: null
  version: "1.0"
  is_demo_placeholder: true

