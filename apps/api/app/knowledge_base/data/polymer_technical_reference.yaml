# Polimer Teknik Referans Kütüphanesi (Faz F.5, Sistem Referans). Bir
# polimer AİLESİNİN (Polymer, polymers.yaml) TİPİK mekanik/fiziksel özellik
# aralığı -- Faz E'deki firma-özel hammadde kartından (Material) FARKLI,
# genel bir kıyaslama kütüphanesi. `polymer_code` ile polymers.yaml'a bağlanır.
#
# ÖNEMLİ — DEMO/VARSAYIMSAL VERİ UYARISI: aşağıdaki aralıklar genel
# mühendislik/literatür bilgisidir (kaynaklı bir veritabanı entegrasyonu
# YOK) -- carbon EF kütüphanesinin aynı temkinli disiplini burada da
# uygulanır.
