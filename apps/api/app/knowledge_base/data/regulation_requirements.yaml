# PPWR Md.7 — kategori+yıl başına AYRI satır (tek bir referans senaryo: gıda
# temaslı + PET dışı plastik). Diğer kategoriler (ör. PET şişeler) henüz
# doğrulanmadığından satır eklenmedi — sabit bir yüzde ASLA varsayılmaz.
- regulation_code: PPWR-ART-7
  regulation_no: "EU 2025/40"
  article: "Md.7"
  packaging_category: gida_temasli_pet_disi_plastik
  target_year: 2030
  requirement_text: >
    2030 itibarıyla asgari %10 geri dönüştürülmüş içerik (post-tüketici PCR)
    zorunludur.
  pcr_only: true
  exception_text: "İstisna, tarih ve metodoloji ayrıca doğrulanmalı."
  effective_date: null
  version: "1.0"
  source: "PPWR (EU) 2025/40 Md.7 — sadeleştirilmiş temsil, tek referans senaryo"
  default_verdict: inceleme_gerekli

