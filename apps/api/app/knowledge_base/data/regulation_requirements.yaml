# PPWR Kural Kütüphanesi (Faz B.8) — her satır bir `Regulation`ın (regulations.yaml,
# `regulation_code` ile eşleşir) tek bir madde/kategori/yıl gerekliliğini temsil
# eder. app/services/packaging_service.py artık bu satırları OKUR; yeni bir madde
# eklemek yeni bir if/elif dalı değil, buraya yeni bir satır eklemek demektir.

- regulation_code: PPWR-ART-10
  regulation_no: "EU 2025/40"
  article: "Md.10 / Ek IV"
  packaging_category: null
  target_year: null
  requirement_text: >
    Ambalaj, gerekli performans/güvenlik/hijyen işlevini sağlayacak asgari
    ağırlık ve hacimde tasarlanmalı; gereksiz boş hacim ve aşırı katman
    kalınlığından kaçınılmalıdır.
  pcr_only: false
  exception_text: null
  effective_date: null
  version: "1.0"
  source: "PPWR (EU) 2025/40 — sadeleştirilmiş temsil"
  default_verdict: inceleme_gerekli

