# Bilgi Tabanı — Masterbatch ve Katkılar Kütüphanesi. carbon_key,
# loader.py tarafından carbon_emission_factors.yaml'daki material_key alanına
# eşlenir (Additive.carbon_ef_id) — bkz. app/services/carbon.py; tüm EF'ler
# bu fazda DEMO/VARSAYIMSALDIR.
- name: UV Stabilizatör Masterbatch
  additive_type: stabilizator
  manufacturer: "Polimer Katkı A.Ş. (varsayımsal)"
  carrier_polymer: PP
  regulatory_document_ref: "EU 10/2011 Uygunluk Beyanı Mevcut"
  effects:
    uv_koruma: true
    mekanik_etki: notr
  dosage_min_pct: 0.5
  dosage_max_pct: 2.0
  food_contact_eligible: true
  cost_per_kg: 85
  carbon_key: "UV Stabilizatör Masterbatch"

- name: Kayganlaştırıcı (Slip) Masterbatch
  additive_type: kaygan_kaydirici
  manufacturer: "Film Katkı San. (varsayımsal)"
  carrier_polymer: PE
  regulatory_document_ref: "EU 10/2011 Uygunluk Beyanı Mevcut"
  effects:
    surtunme_azaltma: true
    mekanik_etki: hafif_negatif
  dosage_min_pct: 0.3
  dosage_max_pct: 1.5
  food_contact_eligible: true
  cost_per_kg: 65
  carbon_key: "Kayganlaştırıcı (Slip) Masterbatch"

- name: Antiblok Masterbatch
  additive_type: antiblok
