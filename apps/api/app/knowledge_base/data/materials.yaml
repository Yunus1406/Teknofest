# Bilgi Tabanı — virgin / PCR / PIR-regranül hammaddeler (Hammadde Teknik
# Kartı). polymer_code, loader.py tarafından polymers.yaml'daki code alanına
# eşlenir. carbon_factor_kg_co2_per_kg burada hâlâ tutulur (legacy/fallback
# alan) ama loader.py artık her satırı carbon_emission_factors.yaml'daki
# aynı isimli (material_key) EF kaydına da bağlar (Material.carbon_ef_id) —
# gerçek kaynak olan odur (bkz. app/services/carbon.py).
#
# material_type: virgin -> Material; pcr -> PcrMaterial; regranul (=PIR) ->
# PirMaterial (bkz. app/models/knowledge.py, single-table inheritance).

- polymer_code: PP
  name: PP Virgin Enjeksiyon Sınıfı
  material_type: virgin
  mfi_g_10min: 12
  density_g_cm3: 0.905
  degradation_factor: 0.0
  food_contact_eligible: true
  max_recommended_ratio_pct: 100
  cost_per_kg: 38
  carbon_factor_kg_co2_per_kg: 1.9
  certification_status: "Gıda sınıfı sertifikalı"

